name: Video Uploader
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Link to Video'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Video
        run: |
          wget -O movie.mp4 "${{ github.event.inputs.video_url }}" || curl -L -o movie.mp4 "${{ github.event.inputs.video_url }}"
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: movie-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: movie.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
