name: Video Uploader (Large Files)
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Link from Seedr'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Video
        run: |
          # لێرەدا فیلمە گەورەکە دادەگرین
          wget --user-agent="Mozilla/5.0" "${{ github.event.inputs.video_url }}" -O movie.mp4

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          files: movie.mp4
          body: "لینکی فایلی ٢ گێگابایتی"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
